<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Games We Offer | UWM Esports</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jaldi:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="games-page">

  <!-- Gold band with the dark triangle -->
  <header class="band band-top">
    <div class="band-triangle"></div>
  </header>

  <main class="games-panel">

    <article class="games-box">
      <h1 class="games-heading">Our Titles</h1>

      <!-- Row 1 and row 2 of game tiles -->
      <ul class="games-grid">
        
      <li>
          <button class="game-tile game-button" popovertarget="overwatch-popout">
            <img class="game-logo" src="images/overwatch.png" alt="Overwatch">
          </button>
      </li>
        <li>
          <a class="game-tile" href="https://playvalorant.com">
            <img class="game-logo" src="images/valorant.png" alt="Valorant">
          </a>
        </li>
        <li>
          <a class="game-tile" href="https://www.pokemon.com">
            <img class="game-logo" src="images/pokemon.png" alt="Pokemon">
          </a>
        </li>
        <li>
          <a class="game-tile" href="https://www.marvelrivals.com">
            <img class="game-logo" src="images/marvel-rivals.png" alt="Marvel Rivals">
          </a>
        </li>
        <li>
          <a class="game-tile" href="https://www.fortnite.com">
            <img class="game-logo" src="images/fortnite.png" alt="Fortnite">
          </a>
        </li>
        <li>
          <a class="game-tile" href="https://www.leagueoflegends.com">
            <img class="game-logo" src="images/league-of-legends.png" alt="League of Legends">
          </a>
        </li>
        <li>
          <a class="game-tile" href="https://www.rocketleague.com">
            <img class="game-logo" src="images/rocket-league.png" alt="Rocket League">
          </a>
        </li>
        <li>
          <a class="game-tile" href="https://www.playdeadlock.com">
            <img class="game-logo" src="images/deadlock.png" alt="Deadlock">
          </a>
        </li>
      </ul>

      <!-- Links to the other pages -->
      <ul class="games-links">
        <li>
          <a class="games-link" href="members.html">
            Members
            <img class="games-arrow" src="images/arrow.svg" alt="">
          </a>
        </li>
        <li>
          <a class="games-link" href="calendar.html">
            Event Calendar
            <img class="games-arrow" src="images/arrow.svg" alt="">
          </a>
        </li>
      </ul>
    </article>

    <a class="home-button" href="index.html">Home</a>

  </main>

</body>
</html>
